name: Deploy lightweight demo (manual)

# Deploys only contracts/moderator_lite.py. Full v2 remains untouched because
# its current Bradbury broadcast payload is rejected at roughly 50 KB.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preflight
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::PRIVATE_KEY secret is not set"
            exit 1
          fi
          node scripts/diagnostics/env-report.mjs
          node scripts/diagnostics/preflight.mjs
      - name: Validate lightweight contract
        run: |
          genvm-lint check contracts/moderator_lite.py
          node --check scripts/deploy-lite.mjs
      - name: Deploy lightweight demo
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: node scripts/deploy-lite.mjs
      - name: Commit public deployment state
        if: always()
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add lite-deploy-state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: record lightweight demo deployment [skip ci]" && git push)
