name: Deploy dApp to GitHub Pages

# Builds the apps/web static export and publishes it to Pages.
# Requires Pages -> Source: GitHub Actions (enable once in repo settings).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          cd apps/web && npm install --no-audit --no-fund
      - name: Resolve deployed registry address
        run: |
          if [ -f deployments.json ]; then
            ADDRESS="$(node -e 'const d=require("./deployments.json"); process.stdout.write(d.prod?.address || "")')"
          else
            ADDRESS=""
          fi
          if [ -n "$ADDRESS" ]; then
            echo "NEXT_PUBLIC_REGISTRY_ADDRESS=$ADDRESS" >> "$GITHUB_ENV"
            echo "Using deployed v2 registry: $ADDRESS"
          else
            echo "::warning::deployments.json has no prod address; publishing the UI in deployment-pending mode"
          fi
      - name: Build static export
        run: npm run build
        working-directory: apps/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
