name: Debug script (manual)

# Runs one Node script from scripts/ with the PRIVATE_KEY secret in env.
# Escape hatch for on-chain diagnostics (payload-size probes, smoke deploys,
# proof runs) that cannot run on the maintainer's flaky local network.
# Trigger: Actions -> Debug script (manual) -> Run workflow -> script path.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script path relative to repo root, e.g. scripts/proofs-v2.mjs"
        required: true
        type: string
      commit_evidence:
        description: "Commit changed evidence/deployment files after the run"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Run script
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: node "${{ inputs.script }}"
      - name: Commit artifacts
        if: ${{ inputs.commit_evidence == 'true' }}
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deployments.json deploy-state.json docs/evidence/v2/ || true
          git commit -m "chore: on-chain artifacts from ${{ inputs.script }} [skip ci]" || echo "no changes"
          git push
