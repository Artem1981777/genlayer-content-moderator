name: CI

# Contract lint + the in-memory direct test suite + script syntax checks.
# Integration tests (tests/integration) run against live Testnet Bradbury and
# need a funded private key, so they are executed locally, never in CI.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract tooling
        run: pip install -r requirements.txt
      - name: genvm-lint (safety checks + validation)
        run: genvm-lint check contracts/registry_v2.py
      - name: Run direct test suite (in-memory GenVM)
        run: pytest tests/direct --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check client scripts
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: packages/sdk
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: packages/sdk
      - name: Test
        run: npx vitest run
        working-directory: packages/sdk

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace deps
        run: npm install --no-audit --no-fund
      - name: Install app deps (web)
        run: npm install --no-audit --no-fund
        working-directory: apps/web
      - name: Install app deps (api)
        run: npm install --no-audit --no-fund
        working-directory: apps/api
      - name: Typecheck web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Typecheck api
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Build web (static export)
        run: npm run build
        working-directory: apps/web
