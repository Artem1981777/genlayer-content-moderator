name: Deploy contract (manual)

# Deploys registry_v2 prod + demo to Bradbury and commits deployments.json +
# deploy-state.json. Resumable: state persists between runs, so a rerun never
# double-deploys (state files are committed AND uploaded as artifacts).
# Requires repository secret PRIVATE_KEY (funded Bradbury key).
# NOTE: the full registry_v2 AddTransaction is ~50KB and currently exceeds the
# Bradbury pubdata ceiling (~17KB, see docs/evidence/v2/deploy-path-matrix.md);
# the run fails honestly and resumes when the network lifts the limit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Preflight checks
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::PRIVATE_KEY secret is not set (repo Settings → Secrets → Actions)"
            exit 1
          fi
          node scripts/diagnostics/env-report.mjs
          node scripts/diagnostics/preflight.mjs
      # deploy-state.json is committed by the workflow below, so a fresh run
      # already restores the latest resumable state through checkout. Do not
      # require an artifact from a previous run (it may have expired or never
      # existed on the first run).
      - name: Deploy prod + demo
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: node scripts/deploy.mjs
      - name: Upload deploy state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-state
          path: |
            deploy-state.json
            deployments.json
          if-no-files-found: ignore
      - name: Commit artifacts
        if: always()
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deployments.json deploy-state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: registry_v2 deployment artifacts [skip ci]" && git push)
